# Publishes a release whenever main has a version that isn't released yet (use `npm run release`).
# On every push to main: if no GitHub release exists for the version in tauri.conf.json
# (checked in a few seconds; otherwise the job stops there), this builds the
# Windows installer, signs it for the in-app updater, creates tag + release vX.Y.Z
# and uploads latest.json, which installed copies check to find updates.
# Release notes come from RELEASE_NOTES.md (written by the release script).
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Work out version and whether it's already released
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v is already released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'notes<<__NOTES__'
            if [ -f RELEASE_NOTES.md ]; then cat RELEASE_NOTES.md; else echo "Minimap Nudge v$v"; fi
            echo '__NOTES__'
          } >> "$GITHUB_OUTPUT"

      - name: Check the signing key secret is set
        if: steps.v.outputs.skip == 'false'
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::Repo secret TAURI_SIGNING_PRIVATE_KEY is missing (Settings > Secrets and variables > Actions)"; exit 1; }

      - uses: actions/setup-node@v5
        if: steps.v.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: steps.v.outputs.skip == 'false'
      - uses: Swatinem/rust-cache@v2
        if: steps.v.outputs.skip == 'false'
        with:
          workspaces: src-tauri

      - name: Install and test
        if: steps.v.outputs.skip == 'false'
        run: |
          npm ci
          npm run test:js
          cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        if: steps.v.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Minimap Nudge v__VERSION__
          releaseBody: ${{ steps.v.outputs.notes }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # A portable copy for people who'd rather not install: the same app exe
      # tauri-action just built (sounds are embedded, so it's a single file).
      # It needs WebView2, which Windows 10/11 already have. Clicking "Update"
      # in a portable copy runs the normal installer, so it becomes an installed copy.
      - name: Attach portable exe to the release
        if: steps.v.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.v.outputs.version }}
        run: |
          exe=src-tauri/target/release/minimap-nudge.exe
          [ -f "$exe" ] || { echo "::error::$exe not found after the build"; exit 1; }
          out="Minimap.Nudge_${V}_x64-portable.exe"
          cp "$exe" "$out"
          gh release upload "v$V" "$out" --clobber --repo "$GITHUB_REPOSITORY"
